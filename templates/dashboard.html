<!DOCTYPE html>
<html lang="en" data-ody-profile="portal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none'%3E%3Cpath stroke='%232F5BD3' stroke-width='3' d='M24 4 8 9.5V22c0 11 7 17.4 16 21.5C33 39.4 40 33 40 22V9.5L24 4Z'/%3E%3C/svg%3E">
  <title>Steadholme Portal</title>
  <link rel="stylesheet" href="/assets/portal-20260907.css">
</head>
<body class="portal-home" data-ody-shell="1.3">
  <script>document.body.classList.add('js');</script>
  <a class="skiplink" href="#catalog">Skip to services</a>
  <header class="top">
    <a class="top__brand" href="/" aria-label="Steadholme home">
      <span class="top__mark" aria-hidden="true">{{SHIELD}}</span>
    </a>
    <div class="top__actions">
      {{HEALTH_CHIP}}
      <div class="usermenu" id="usermenu">
        <button class="usermenu__btn" id="account-toggle" type="button" aria-expanded="false" aria-controls="account-popover" aria-label="Account links">
          <span class="avatar" aria-hidden="true">{{INITIAL}}</span>
          <span class="usermenu__name" data-user-name="{{NAME}}">{{NAME}}</span>
          <svg class="usermenu__caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="usermenu__pop" id="account-popover" aria-label="Account" hidden>
          <div class="usermenu__head">
            <span class="avatar avatar--lg" aria-hidden="true">{{INITIAL}}</span>
            <span><b>{{NAME}}</b><span>{{EMAIL}}</span></span>
          </div>
          <a class="menuitem" href="https://account.w33d.xyz">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
            Account
          </a>
          <a class="menuitem" href="https://w33d.xyz">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            All services
          </a>
          <a class="menuitem menuitem--danger" href="https://sso.w33d.xyz/_gw/auth/logout" title="Sign out" aria-label="Sign out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
            Sign out
          </a>
        </div>
      </div>
    </div>
  </header>

  <main id="top">
    <h1 class="sr-only">Steadholme Portal</h1>

    <section class="hero" aria-label="Search">
      <form class="command" role="search" method="get" action="/">
        <svg class="command__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="appsearch" name="q" value="{{SEARCH_VALUE}}" type="search" placeholder="Search services" autocomplete="off" aria-label="Search services" aria-describedby="search-results-status">
        <kbd class="command__kbd">⌘K</kbd>
      </form>
      <div class="quick" id="quick" hidden>
        <div class="quick__group" id="recentapps" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span class="sr-only">Recent</span>
          <div class="quick__chips" id="recentgrid"></div>
        </div>
        <div class="quick__group" id="personalapps" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.47 6.03.88-4.36 4.25 1.03 6-5.4-2.84-5.4 2.84 1.03-6-4.36-4.25 6.03-.88L12 3Z"/></svg>
          <span class="sr-only">Pinned</span>
          <div class="quick__chips" id="pinnedapps"></div>
        </div>
      </div>
    </section>

    <div class="bento">
      {{LIVE}}
      <section class="catalog" id="catalog" tabindex="-1" aria-label="Services">
        <div class="clusters" id="appsections">
          {{SECTIONS}}
        </div>
        <p class="noresults" id="noresults" role="status">No services match.</p>
      </section>
    </div>
  </main>

  <div class="sr-only" id="personalization-status" role="status" aria-live="polite"></div>
  <div class="sr-only" id="search-results-status" role="status" aria-live="polite"></div>

  <div class="drawer" id="app-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
    <div class="drawer__panel" id="drawer-panel" tabindex="-1">
      <button class="drawer__close iconbtn" id="drawer-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="drawer__head">
        <span class="drawer__icon" id="drawer-icon" aria-hidden="true"></span>
        <div class="drawer__id">
          <h2 class="drawer__title" id="drawer-title"></h2>
          <p class="drawer__cat" id="drawer-cat"></p>
        </div>
      </div>
      <p class="drawer__desc" id="drawer-desc"></p>
      <dl class="drawer__facts">
        <div class="drawer__fact" id="drawer-status" data-health="unknown">
          <dt>Status</dt>
          <dd><span class="drawer__dot" aria-hidden="true"></span><span id="drawer-status-text"></span></dd>
        </div>
        <div class="drawer__fact">
          <dt>Address</dt>
          <dd id="drawer-host"></dd>
        </div>
        <div class="drawer__fact" id="drawer-scope" hidden>
          <dt>Access</dt>
          <dd>VPN</dd>
        </div>
      </dl>
      <div class="drawer__actions">
        <a class="drawer__openbtn" id="drawer-open" href="/"></a>
        <button class="drawer__pinbtn" id="drawer-pin" type="button" data-pin-button data-app-id="" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 3 2.7 5.47 6.03.88-4.36 4.25 1.03 6-5.4-2.84-5.4 2.84 1.03-6-4.36-4.25 6.03-.88L12 3Z"/></svg>
          <span class="drawer__pinlabel">Pin</span>
        </button>
      </div>
    </div>
  </div>

  <div class="palette" id="cmdpalette" role="dialog" aria-modal="true" aria-label="Search services" hidden>
    <div class="palette__panel">
      <div class="palette__head">
        <div class="palette__field">
          <svg class="palette__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="cmdinput" class="palette__input" type="search" autocomplete="off" aria-controls="cmdresults" aria-activedescendant="" aria-label="Search services" placeholder="Search services">
        </div>
        <button class="palette__close iconbtn" id="cmdclose" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="palette__list" id="cmdresults" role="listbox" aria-label="Services"></div>
      <div class="palette__more" id="cmdmore" hidden></div>
      <div class="palette__empty" id="cmdempty" hidden>No services match.</div>
    </div>
  </div>

  {{ODYSSEY_RUNTIME}}
  <script>
  (function () {
    var userMenu = document.getElementById('usermenu'),
        userButton = document.getElementById('account-toggle'),
        userPopover = document.getElementById('account-popover');
    function setAccount(open, restoreFocus) {
      if (!userButton || !userPopover) return;
      userPopover.hidden = !open;
      userButton.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (!open && restoreFocus) userButton.focus();
    }
    if (userButton) userButton.addEventListener('click', function () {
      setAccount(userButton.getAttribute('aria-expanded') !== 'true', false);
    });

    function slice(list) { return Array.prototype.slice.call(list || []); }
    function textOf(el) { return el ? (el.textContent || '').trim() : ''; }
    function closest(el, selector) {
      while (el && el !== document) {
        if (el.matches && el.matches(selector)) return el;
        el = el.parentNode;
      }
      return null;
    }
    function isEditable(el) {
      if (!el) return false;
      var tag = (el.tagName || '').toLowerCase();
      return tag === 'input' || tag === 'textarea' || tag === 'select' || el.isContentEditable;
    }
    document.addEventListener('click', function (e) {
      if (userMenu && !closest(e.target, '#usermenu')) setAccount(false, false);
    });
    if (userMenu) userMenu.addEventListener('focusout', function () {
      window.setTimeout(function () {
        if (!userMenu.contains(document.activeElement)) setAccount(false, false);
      }, 0);
    });

    // ----- Catalog model (server-rendered clusters are the source of truth) -----
    var apps = slice(document.querySelectorAll('#appsections .app')).map(function (link, index) {
      var name = textOf(link.querySelector('.app__name')),
          desc = textOf(link.querySelector('.app__desc')),
          sec = closest(link, '[data-section]'),
          category = sec ? (sec.getAttribute('data-category') || textOf(sec.querySelector('h2, h3'))) : '',
          cls = link.getAttribute('class') || '';
      return {
        id: link.getAttribute('data-app-id') || link.getAttribute('href') || link.href,
        productId: link.getAttribute('data-product-id') || '',
        profile: link.getAttribute('data-ody-profile') || '',
        href: link.getAttribute('href') || link.href,
        name: name,
        desc: desc,
        category: category,
        scope: link.getAttribute('data-access-scope') || 'public',
        health: link.getAttribute('data-health') || 'unknown',
        soon: Boolean(link.querySelector('.app__soon')),
        text: (name + ' ' + desc + ' ' + category).toLowerCase(),
        className: cls,
        link: link,
        order: index
      };
    }).filter(function (app) { return app.id && app.href && app.name; });

    function findApp(id) {
      for (var i = 0; i < apps.length; i++) {
        if (apps[i].id === id) return apps[i];
      }
      return null;
    }

    // ----- Search (filters the clusters in place; the ?q= form still works without JS) -----
    var box = document.getElementById('appsearch'),
        none = document.getElementById('noresults'),
        quick = document.getElementById('quick'),
        internalZone = document.getElementById('infraops'),
        searchStatus = document.getElementById('search-results-status');
    function applySearch() {
      var q = (box && box.value || '').trim().toLowerCase(), anyVisible = false, total = 0;
      slice(document.querySelectorAll('#appsections [data-section]')).forEach(function (sec) {
        var shown = 0;
        slice(sec.querySelectorAll('.app')).forEach(function (a) {
          var hit = !q || (a.getAttribute('data-name') || '').indexOf(q) !== -1;
          var tile = closest(a, '.appwrap') || a;
          tile.classList.toggle('s-off', !hit);
          if (hit) { shown++; total++; }
        });
        sec.classList.toggle('s-off', !shown);
        if (shown) anyVisible = true;
      });
      if (internalZone) internalZone.classList.toggle('s-off', !internalZone.querySelector('.appwrap:not(.s-off)'));
      if (none) none.classList.toggle('show', !anyVisible && !document.querySelector('#appsections .empty'));
      if (quick) quick.hidden = Boolean(q) || (recentIds.length === 0 && pinnedIds.length === 0);
      if (searchStatus) searchStatus.textContent = q ? total + (total === 1 ? ' service' : ' services') + ' found.' : '';
    }
    if (box) {
      box.addEventListener('input', applySearch);
      box.addEventListener('keydown', function (e) { if (e.key === 'Escape') { box.value = ''; applySearch(); box.blur(); } });
      if (box.form) box.form.addEventListener('submit', function (e) { e.preventDefault(); applySearch(); });
    }

    // ----- Local personalization (pins + recents; storage keys are frozen) -----
    var pinnedKey = 'holdfast.portal.pinnedApps.v1',
        recentKey = 'holdfast.portal.recentApps.v1',
        recentLimit = 4,
        personalizationStatus = document.getElementById('personalization-status'),
        pinnedGroup = document.getElementById('personalapps'),
        pinnedGrid = document.getElementById('pinnedapps'),
        recentGroup = document.getElementById('recentapps'),
        recentGrid = document.getElementById('recentgrid');

    function readList(key) {
      try {
        var parsed = JSON.parse(window.localStorage.getItem(key) || '[]');
        return Array.isArray(parsed) ? parsed.filter(function (id) { return typeof id === 'string'; }) : [];
      } catch (_) {
        return [];
      }
    }
    function writeList(key, ids) {
      try {
        window.localStorage.setItem(key, JSON.stringify(ids));
      } catch (_) {}
    }
    function knownIds(ids, limit) {
      var seen = {}, out = [];
      ids.forEach(function (id) {
        if (!seen[id] && findApp(id)) {
          seen[id] = true;
          out.push(id);
        }
      });
      return typeof limit === 'number' ? out.slice(0, limit) : out;
    }
    var pinnedIds = knownIds(readList(pinnedKey)),
        recentIds = knownIds(readList(recentKey), recentLimit);

    function syncPinButtons() {
      slice(document.querySelectorAll('[data-pin-button]')).forEach(function (btn) {
        var app = findApp(btn.getAttribute('data-app-id'));
        if (!app) return;
        var pinned = pinnedIds.indexOf(app.id) !== -1,
            label = (pinned ? 'Unpin ' : 'Pin ') + app.name,
            text = btn.querySelector('.drawer__pinlabel');
        btn.classList.toggle('is-pinned', pinned);
        btn.setAttribute('aria-pressed', pinned ? 'true' : 'false');
        btn.setAttribute('aria-label', label);
        btn.setAttribute('title', label);
        if (text) text.textContent = pinned ? 'Unpin' : 'Pin';
      });
    }
    function enhanceAppLink(link) {
      link.setAttribute('aria-haspopup', 'dialog');
      link.setAttribute('aria-controls', 'app-drawer');
      link.setAttribute('aria-expanded', 'false');
    }
    function createChip(app) {
      var link = document.createElement('a'),
          icon = app.link.querySelector('.app__icon'),
          name = document.createElement('span');
      link.className = 'chip ' + app.className;
      link.href = app.href;
      link.title = app.desc ? app.name + ' — ' + app.desc : app.name;
      link.setAttribute('data-app-id', app.id);
      if (app.productId) link.setAttribute('data-product-id', app.productId);
      if (app.profile) link.setAttribute('data-ody-profile', app.profile);
      enhanceAppLink(link);
      if (icon) link.appendChild(icon.cloneNode(true));
      name.className = 'app__name';
      name.textContent = app.name;
      link.appendChild(name);
      return link;
    }
    function renderGroup(group, grid, ids) {
      if (!group || !grid) return;
      while (grid.firstChild) grid.removeChild(grid.firstChild);
      ids.forEach(function (id) {
        var app = findApp(id);
        if (app) grid.appendChild(createChip(app));
      });
      group.hidden = ids.length === 0;
    }
    function renderPinned() {
      pinnedIds = knownIds(pinnedIds);
      renderGroup(pinnedGroup, pinnedGrid, pinnedIds);
      if (quick) quick.hidden = Boolean((box && box.value || '').trim()) || (recentIds.length === 0 && pinnedIds.length === 0);
      syncPinButtons();
    }
    function renderRecent() {
      recentIds = knownIds(recentIds, recentLimit);
      renderGroup(recentGroup, recentGrid, recentIds);
      if (quick) quick.hidden = Boolean((box && box.value || '').trim()) || (recentIds.length === 0 && pinnedIds.length === 0);
      syncPinButtons();
    }
    function togglePin(id) {
      var next = pinnedIds.slice(),
          at = next.indexOf(id),
          app = findApp(id);
      if (!app) return;
      if (at === -1) next.unshift(id);
      else next.splice(at, 1);
      pinnedIds = knownIds(next);
      writeList(pinnedKey, pinnedIds);
      renderPinned();
      if (personalizationStatus) personalizationStatus.textContent = (at === -1 ? 'Pinned ' : 'Unpinned ') + app.name + '.';
    }
    function recordRecent(id) {
      if (!findApp(id)) return;
      recentIds = knownIds([id].concat(recentIds.filter(function (old) { return old !== id; })), recentLimit);
      writeList(recentKey, recentIds);
      renderRecent();
    }

    // ----- Overlays (single-overlay invariant, focus restore, inert background) -----
    var palette = document.getElementById('cmdpalette'),
        paletteInput = document.getElementById('cmdinput'),
        paletteResults = document.getElementById('cmdresults'),
        paletteEmpty = document.getElementById('cmdempty'),
        paletteMore = document.getElementById('cmdmore'),
        paletteClose = document.getElementById('cmdclose'),
        drawer = document.getElementById('app-drawer'),
        drawerPanel = document.getElementById('drawer-panel'),
        drawerClose = document.getElementById('drawer-close'),
        stage = document.getElementById('top'),
        overlayEl = null,
        previousFocus = null,
        drawerTrigger = null,
        paletteIndex = 0,
        paletteMatches = [];
    function inertRoots() {
      return [document.querySelector('.top'), stage].filter(Boolean);
    }
    function firstFocusable(root) {
      return root ? root.querySelector('a[href]:not(.s-off), button:not([disabled]), input') : null;
    }
    function openOverlay(el) {
      if (overlayEl === el) return;
      if (overlayEl) closeOverlay(false);
      setAccount(false, false);
      previousFocus = document.activeElement;
      el.hidden = false;
      document.body.classList.add('overlay-open');
      if (el === palette) document.body.classList.add('palette-open');
      inertRoots().forEach(function (r) { try { r.inert = true; } catch (_) {} });
      overlayEl = el;
    }
    function closeOverlay(restoreFocus) {
      if (!overlayEl) return;
      var el = overlayEl;
      overlayEl = null;
      el.hidden = true;
      document.body.classList.remove('overlay-open');
      document.body.classList.remove('palette-open');
      inertRoots().forEach(function (r) { try { r.inert = false; } catch (_) {} });
      if (el === drawer && drawerTrigger) {
        drawerTrigger.setAttribute('aria-expanded', 'false');
        drawerTrigger = null;
      }
      if (restoreFocus && previousFocus && previousFocus.focus) {
        if (previousFocus.offsetParent !== null || previousFocus === document.body) previousFocus.focus();
        else {
          var fallback = firstFocusable(stage);
          if (fallback) fallback.focus();
        }
      }
      previousFocus = null;
    }
    function trapTab(e, root) {
      var focusable = slice(root.querySelectorAll('input, button, a[href], [tabindex="-1"]')).filter(function (el) {
            return !el.disabled && el.offsetParent !== null && el.getAttribute('tabindex') !== '-1';
          }),
          first = focusable[0],
          last = focusable[focusable.length - 1];
      if (!first || !last) return;
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }

    // ----- Command palette -----
    function fuzzyScore(query, text) {
      var q = query.toLowerCase(), qi = 0, last = -2, score = 0, exact, i;
      if (!q) return 1;
      exact = text.indexOf(q);
      if (exact !== -1) return 1000 - exact;
      for (i = 0; i < text.length && qi < q.length; i++) {
        if (text.charAt(i) === q.charAt(qi)) {
          score += (i === last + 1) ? 8 : 3;
          last = i;
          qi++;
        }
      }
      return qi === q.length ? score : -1;
    }
    function searchApps(query) {
      return apps.map(function (app) {
        return { app: app, score: fuzzyScore(query, app.text) };
      }).filter(function (match) {
        return match.score >= 0;
      }).sort(function (a, b) {
        return (b.score - a.score) || (a.app.order - b.app.order);
      });
    }
    function paletteCap() {
      if (window.innerHeight <= 360) return 3;
      if (window.innerWidth < 360) return 4;
      if (window.innerWidth < 768) return 5;
      return 6;
    }
    function updatePaletteSelection() {
      var items = slice(paletteResults ? paletteResults.querySelectorAll('.palette__item') : []);
      items.forEach(function (item, index) {
        var active = index === paletteIndex;
        item.classList.toggle('is-active', active);
        item.setAttribute('aria-selected', active ? 'true' : 'false');
        if (active && paletteInput) paletteInput.setAttribute('aria-activedescendant', item.id);
      });
      if (!items.length && paletteInput) paletteInput.setAttribute('aria-activedescendant', '');
    }
    function renderPalette() {
      if (!paletteResults || !paletteInput || !paletteEmpty) return;
      var query = (paletteInput.value || '').trim(),
          all = searchApps(query),
          cap = paletteCap(),
          extra = Math.max(0, all.length - cap);
      paletteMatches = all.slice(0, cap);
      if (paletteIndex >= paletteMatches.length) paletteIndex = Math.max(0, paletteMatches.length - 1);
      while (paletteResults.firstChild) paletteResults.removeChild(paletteResults.firstChild);
      paletteMatches.forEach(function (match, index) {
        var app = match.app,
            item = document.createElement('a'),
            icon = app.link.querySelector('.app__icon'),
            body = document.createElement('span'),
            name = document.createElement('span'),
            desc = document.createElement('span');
        item.id = 'cmdoption-' + index;
        item.className = 'palette__item ' + app.className;
        item.href = app.href;
        item.setAttribute('role', 'option');
        item.setAttribute('data-app-id', app.id);
        if (app.productId) item.setAttribute('data-product-id', app.productId);
        if (app.profile) item.setAttribute('data-ody-profile', app.profile);
        if (icon) item.appendChild(icon.cloneNode(true));
        body.className = 'palette__copy';
        name.className = 'palette__name';
        name.textContent = app.name;
        desc.className = 'palette__desc';
        desc.textContent = app.desc || app.category;
        body.appendChild(name);
        body.appendChild(desc);
        item.appendChild(body);
        item.addEventListener('mouseenter', function () {
          paletteIndex = index;
          updatePaletteSelection();
        });
        item.addEventListener('click', function () { closeOverlay(false); });
        paletteResults.appendChild(item);
      });
      if (paletteMore) {
        paletteMore.hidden = !extra;
        paletteMore.textContent = extra ? extra + ' more' : '';
      }
      paletteEmpty.hidden = paletteMatches.length !== 0;
      updatePaletteSelection();
    }
    function openPalette(seed) {
      if (!palette || !paletteInput) return;
      openOverlay(palette);
      paletteIndex = 0;
      paletteInput.value = seed || '';
      renderPalette();
      window.setTimeout(function () {
        paletteInput.focus();
        paletteInput.select();
      }, 0);
    }
    function selectedPaletteApp() {
      return paletteMatches[paletteIndex] && paletteMatches[paletteIndex].app;
    }
    function goSelectedPaletteApp() {
      var app = selectedPaletteApp();
      if (!app) return;
      recordRecent(app.id);
      window.location.href = app.href;
    }
    if (paletteInput) paletteInput.addEventListener('input', function () { paletteIndex = 0; renderPalette(); });
    if (paletteClose) paletteClose.addEventListener('click', function () { closeOverlay(true); });
    if (palette) palette.addEventListener('click', function (e) { if (e.target === palette) closeOverlay(true); });

    // ----- Drawer -----
    var HEALTH_LABEL = { operational: 'Operational', degraded: 'Degraded', down: 'Down', unknown: '—' },
        dIcon = document.getElementById('drawer-icon'),
        dTitle = document.getElementById('drawer-title'),
        dCat = document.getElementById('drawer-cat'),
        dDesc = document.getElementById('drawer-desc'),
        dStatus = document.getElementById('drawer-status'),
        dStatusText = document.getElementById('drawer-status-text'),
        dHost = document.getElementById('drawer-host'),
        dScope = document.getElementById('drawer-scope'),
        dOpen = document.getElementById('drawer-open'),
        dPin = document.getElementById('drawer-pin');
    function hostOf(href) {
      try { return new URL(href, window.location.href).host; } catch (_) { return ''; }
    }
    function openDrawer(app, trigger) {
      if (!drawer || !app) return;
      while (dIcon.firstChild) dIcon.removeChild(dIcon.firstChild);
      var icon = app.link.querySelector('.app__icon');
      if (icon) {
        var wrap = document.createElement('span');
        wrap.className = app.className;
        wrap.appendChild(icon.cloneNode(true));
        dIcon.appendChild(wrap);
      }
      dTitle.textContent = app.name;
      dCat.textContent = app.category || '';
      dDesc.textContent = app.desc || '';
      dStatus.setAttribute('data-health', app.soon ? 'soon' : app.health);
      dStatusText.textContent = app.soon ? 'Soon' : (HEALTH_LABEL[app.health] || HEALTH_LABEL.unknown);
      dHost.textContent = hostOf(app.href);
      dScope.hidden = app.scope !== 'internal';
      dOpen.href = app.href;
      dOpen.textContent = 'Open ' + app.name;
      dOpen.setAttribute('data-app-id', app.id);
      dPin.setAttribute('data-app-id', app.id);
      syncPinButtons();
      openOverlay(drawer);
      drawerTrigger = trigger || null;
      if (drawerTrigger) drawerTrigger.setAttribute('aria-expanded', 'true');
      if (drawerClose) drawerClose.focus();
      else drawerPanel.focus();
    }
    if (drawerClose) drawerClose.addEventListener('click', function () { closeOverlay(true); });
    if (drawer) drawer.addEventListener('click', function (e) { if (e.target === drawer) closeOverlay(true); });

    // ----- Global pointer + keyboard wiring -----
    document.addEventListener('click', function (e) {
      var pin = closest(e.target, '[data-pin-button]'),
          appLink, openLink;
      if (pin) {
        e.preventDefault();
        e.stopPropagation();
        togglePin(pin.getAttribute('data-app-id'));
        return;
      }
      openLink = closest(e.target, '#drawer-open');
      if (openLink) {
        recordRecent(openLink.getAttribute('data-app-id'));
        return;
      }
      appLink = closest(e.target, 'a.palette__item[data-app-id]');
      if (appLink) {
        recordRecent(appLink.getAttribute('data-app-id'));
        return;
      }
      appLink = closest(e.target, 'a.app[data-app-id]');
      if (!appLink) return;
      if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) {
        recordRecent(appLink.getAttribute('data-app-id'));
        return;
      }
      var app = findApp(appLink.getAttribute('data-app-id'));
      if (!app) return;
      e.preventDefault();
      openDrawer(app, appLink);
    });
    document.addEventListener('keydown', function (e) {
      var key = e.key || '';
      if (overlayEl === palette) {
        if (key === 'Escape') { e.preventDefault(); closeOverlay(true); return; }
        if (key === 'ArrowDown') { e.preventDefault(); paletteIndex = Math.min(paletteIndex + 1, Math.max(0, paletteMatches.length - 1)); updatePaletteSelection(); return; }
        if (key === 'ArrowUp') { e.preventDefault(); paletteIndex = Math.max(0, paletteIndex - 1); updatePaletteSelection(); return; }
        if (key === 'Enter' && document.activeElement !== paletteClose && !closest(document.activeElement, 'a.palette__item')) { e.preventDefault(); goSelectedPaletteApp(); return; }
        if (key === 'Tab') trapTab(e, palette);
        return;
      }
      if (overlayEl) {
        if (key === 'Escape') { e.preventDefault(); closeOverlay(true); return; }
        if (key === 'Tab') trapTab(e, overlayEl);
        return;
      }
      if (key === 'Escape' && userButton && userButton.getAttribute('aria-expanded') === 'true') {
        e.preventDefault();
        setAccount(false, true);
        return;
      }
      if ((e.metaKey || e.ctrlKey) && key.toLowerCase() === 'k') {
        e.preventDefault();
        openPalette('');
        return;
      }
      if (key === '/' && !e.metaKey && !e.ctrlKey && !e.altKey && !isEditable(document.activeElement)) {
        e.preventDefault();
        if (box && box.offsetParent !== null) {
          box.focus();
          box.select();
        } else {
          openPalette('');
        }
      }
    });

    // ----- Boot -----
    apps.forEach(function (app) { enhanceAppLink(app.link); });
    renderPinned();
    renderRecent();
    applySearch();
    syncPinButtons();
  })();
  </script>
</body>
</html>
