<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>HOLDFAST · Command Center</title>
  <style>{{CSS}}</style>
</head>
<body class="page-console">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/" aria-label="HOLDFAST home">
        <span class="brand__glyph" aria-hidden="true">{{SHIELD}}</span>
        <span class="brand__word">HOLDFAST</span>
        <span class="brand__tag">Command Center</span>
      </a>
      <div class="topbar__right">
        <span class="user" title="{{EMAIL}}">
          <span class="user__avatar" aria-hidden="true">{{INITIAL}}</span>
          <span class="user__email">{{EMAIL}}</span>
        </span>
        <a class="btn btn-ghost btn-sm" href="https://id.w33d.xyz/_gw/auth/logout">Log out</a>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="hero__inner">
      <p class="hero__eyebrow">Sovereign Cloud · Operations</p>
      <h1 class="hero__title">{{GREETING}}</h1>
      <p class="hero__sub">{{HERO_SUB}}</p>
    </div>
  </section>

  <main class="console">
    <section class="metrics" aria-label="Live metrics">
      {{METRICS}}
    </section>

    <div class="grid">
      <section class="panel panel--services">
        <div class="panel__head">
          <h2 class="panel__title">Services</h2>
          <span class="panel__hint">Live status from Beacon</span>
        </div>
        <div class="tiles">
          {{TILES}}
        </div>
      </section>

      <aside class="panel panel--activity">
        <div class="panel__head">
          <h2 class="panel__title">Recent activity</h2>
          <span class="panel__hint">Audit trail</span>
        </div>
        <div class="feed">
          {{ACTIVITY}}
        </div>
      </aside>
    </div>
  </main>

  <footer class="site-foot">
    <span>HOLDFAST · Sovereign infrastructure</span>
    <span>One sign-on across every service.</span>
  </footer>
</body>
</html>
